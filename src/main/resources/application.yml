spring:
  application:
    name: ai-delivery-efficiency-backend
server:
  port: 8088
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.leo.ai.delivery.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn