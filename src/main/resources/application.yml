spring:
  application:
    name: ai-delivery-efficiency-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_delivery_efficiency
    username: root
    password: 123456
server:
  port: 8088
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.leo.ai.delivery.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn